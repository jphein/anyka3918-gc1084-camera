<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Camera aperture">
  <!-- A lens iris: six blades around an open centre. Reads at 16px because the
       shapes are large and the centre stays hollow — detail would turn to mud. -->
  <defs>
    <style>
      .ring { fill: none; stroke: #0f766e; stroke-width: 2.5; }
      .blade { fill: #0f766e; }
      .pupil { fill: #f59e0b; }
      @media (prefers-color-scheme: dark) {
        .ring { stroke: #2dd4bf; }
        .blade { fill: #2dd4bf; }
        .pupil { fill: #fbbf24; }
      }
    </style>
  </defs>
  <circle class="ring" cx="16" cy="16" r="13"/>
  <g class="blade">
    <path d="M16 6 L23 10 L16 14 Z"/>
    <path d="M24.7 21 L24.7 13 L18 17 Z"/>
    <path d="M24.7 21 L17.7 25 L17.7 17 Z"/>
    <path d="M16 26 L9 22 L16 18 Z"/>
    <path d="M7.3 11 L7.3 19 L14 15 Z"/>
    <path d="M7.3 11 L14.3 7 L14.3 15 Z"/>
  </g>
  <circle class="pupil" cx="16" cy="16" r="2.4"/>
</svg>
